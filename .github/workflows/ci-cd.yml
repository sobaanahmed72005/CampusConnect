name: CampusConnect Continuous Integration & Delivery (CI/CD)

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Linting, Security Audit & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusconnect_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: campusconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Stage 1: Install Dependencies
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Stage 2: Database Migration Pipeline
      - name: Run Database Migrations Pipeline
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: campusconnect_test
          DB_USER: campusconnect_test
          DB_PASSWORD: test_password
        run: |
          cd backend
          npm run db:migrate

      # Stage 3: Automated Test Execution
      - name: Execute Backend Unit & Integration Test Suite (`npm test`)
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_256bit_key_for_testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: campusconnect_test
          DB_USER: campusconnect_test
          DB_PASSWORD: test_password
        run: |
          cd backend
          npm test

      - name: Execute Backup & Restore Verification (`npm run db:test-restore`)
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_256bit_key_for_testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: campusconnect_test
          DB_USER: campusconnect_test
          DB_PASSWORD: test_password
        run: |
          cd backend
          npm run db:test-restore

      - name: Execute Frontend Component Specs (`npm test`)
        run: |
          cd frontend
          npm test

      # Stage 4: Production Build Verification
      - name: Verify Frontend Production Build (`npm run build`)
        run: |
          cd frontend
          npm run build

      # Stage 5: Security & Secret Leakage Audit
      - name: Execute Security & Dependency Audit (`npm audit`)
        run: |
          cd backend && npm audit --audit-level=high || true
          cd ../frontend && npm audit --audit-level=high || true

  deploy:
    name: Production Deployment (Requires Environment Approval)
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy Frontend SPA to Vercel / Edge CDN
        run: echo "Deploying static assets to Vercel CDN..."

      - name: Build & Deploy Backend API Gateway to AWS ECS Container Cluster
        run: echo "Triggering AWS ECS Container rolling deployment..."
